<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>One Love Bar 🌴 — Las Terrenas</title>
<meta name="description" content="One Love Bar — Playa Ballenas, Las Terrenas, Samaná, Dominican Republic.">
<style>
  :root {
    --bg-dark: #06120f;
    --text: #eaf6f4;
    --text-dim: #9db8b3;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg-dark);
    color: var(--text);
    font-family: 'Helvetica Neue', Arial, sans-serif;
    line-height: 1.6;
  }
  img { max-width: 100%; display: block; }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 0 20px; }

  header {
    text-align: center;
    padding: 60px 20px 40px;
  }
  header img.logo { height: 150px; width: auto; margin: 0 auto 20px; }
  header p { color: var(--text-dim); font-size: 15px; letter-spacing: 0.5px; }

  .gallery-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    padding: 0 0 60px;
  }
  .gallery-grid img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    aspect-ratio: 4/5;
    border-radius: 6px;
  }
  .gallery-grid .wide { grid-column: span 2; aspect-ratio: 16/10; }
  .gallery-grid .wide img { aspect-ratio: 16/10; }
  @media (max-width: 800px) {
    .gallery-grid { grid-template-columns: repeat(2, 1fr); }
    .gallery-grid .wide { grid-column: span 2; }
  }

  footer {
    padding: 30px 20px 50px;
    text-align: center;
    color: var(--text-dim);
    font-size: 13px;
  }
  footer a { color: var(--text-dim); text-decoration: underline; }
  footer .contact-line { margin-top: 8px; }
</style>
</head>
<body>

<header>
  <img class="logo" src="assets/logo.png" alt="One Love Bar logo">
  <p>Playa Ballenas · Las Terrenas · Samaná · Dominican Republic</p>
</header>

<div class="wrap">
  <div class="gallery-grid">
    <div class="wide"><img src="assets/photo_hero_daytime.jpg" alt="One Love Bar exterior"></div>
    <img src="assets/photo_entrance_night_1.jpg" alt="One Love Bar entrance at night">
    <img src="assets/photo_bar_stocked.jpg" alt="The bar">
    <img src="assets/photo_tiki_night.jpg" alt="Tiki statue">
    <div class="wide"><img src="assets/photo_bar_people.jpg" alt="Bar seating"></div>
    <img src="assets/photo_lantern_light.jpg" alt="Lighting detail">
    <img src="assets/photo_seating_tables.jpg" alt="Seating area">
    <img src="assets/photo_booth_seating.jpg" alt="Booth seating">
    <img src="assets/photo_entrance_night_2.jpg" alt="Entrance walkway">
  </div>
</div>

<footer>
  One Love Bar &amp; Restaurant · Playa Ballenas, Las Terrenas, Samaná, Dominican Republic
  <div class="contact-line">
    <a href="mailto:amurthy@onelovebeachbar.com">amurthy@onelovebeachbar.com</a>
    &nbsp;·&nbsp;
    <a href="https://maps.app.goo.gl/XkQwJAivvSykx77C7" target="_blank" rel="noopener">View on Google Maps</a>
  </div>
</footer>

</body>
</html>
